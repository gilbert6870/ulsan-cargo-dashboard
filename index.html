<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>흥아라인 울산항 물동량 대시보드</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
:root{--bg:#0f172a;--card:#1e293b;--card2:#263348;--border:#334155;--accent:#2196F3;--exp:#e84c4c;--imp:#2196F3;--green:#2ea44f;--yellow:#f59e0b;--purple:#7c3aed;--text:#f1f5f9;--muted:#94a3b8}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden;font-size:13px}
header{background:var(--card);border-bottom:1px solid var(--border);height:44px;display:flex;align-items:center;padding:0 12px;gap:10px;flex-shrink:0}
header h1{font-size:14px;font-weight:700;white-space:nowrap}
header h1 span{color:var(--accent)}
#statusBar{font-size:11px;color:var(--muted);margin-left:auto;text-align:right;white-space:nowrap}
#loadingBar{width:180px;height:3px;background:var(--border);border-radius:2px;display:none}
#loadingFill{height:100%;background:var(--accent);border-radius:2px;width:0;transition:width .3s}
#controls{background:var(--card2);border-bottom:1px solid var(--border);padding:5px 12px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;flex-shrink:0}
.ctrl-label{font-size:11px;color:var(--muted);white-space:nowrap}
.btn{padding:3px 9px;border-radius:5px;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer;font-size:12px;transition:.15s}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.exp-btn.active{background:var(--exp);border-color:var(--exp)}
.btn.imp-btn.active{background:#1565c0;border-color:#1565c0}
.divider{width:1px;height:22px;background:var(--border);flex-shrink:0}
input[type=date]{background:var(--card);border:1px solid var(--border);border-radius:5px;color:var(--text);padding:2px 6px;font-size:12px;height:26px}
input[type=date]:focus{outline:none;border-color:var(--accent)}
select{background:var(--card);border:1px solid var(--border);border-radius:5px;color:var(--text);padding:2px 6px;font-size:12px;height:26px;cursor:pointer}
#alertBar{display:none;padding:4px 12px;font-size:12px;align-items:center;gap:8px;flex-shrink:0}
.alert-info{background:#1e3a5f;color:#7dd3fc}
.alert-success{background:#14532d;color:#86efac}
.alert-error{background:#450a0a;color:#fca5a5}
#kpiRow{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;padding:6px 12px;flex-shrink:0}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:8px 10px;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;top:0;left:0;right:0;height:2px}
.kpi-total::before{background:var(--accent)}.kpi-exp::before{background:var(--exp)}.kpi-imp::before{background:var(--imp)}.kpi-v::before{background:var(--yellow)}.kpi-s::before{background:var(--purple)}.kpi-f::before{background:var(--green)}.kpi-ts::before{background:#f59e0b}
.kpi-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.kpi-val{font-size:20px;font-weight:700;line-height:1.1;margin:2px 0}
.kpi-sub{font-size:10px;color:var(--muted)}
#dash{flex:1;overflow:hidden;display:grid;padding:0 12px 8px;gap:6px;min-height:0;grid-template-rows:1fr 1fr;grid-template-columns:2fr 1fr 1fr 1fr}
.card{background:var(--card);border:1px solid var(--border);border-radius:8px;display:flex;flex-direction:column;overflow:hidden;min-height:0}
.card-hdr{display:flex;align-items:center;padding:5px 8px;border-bottom:1px solid var(--border);flex-shrink:0;gap:4px}
.card-title{font-size:11px;font-weight:600;flex:1}
.expand-btn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:13px;padding:1px 4px;border-radius:3px;line-height:1}
.expand-btn:hover{color:var(--text);background:var(--card2)}
.card-body{flex:1;padding:6px;min-height:0;position:relative}
.card-daily{grid-column:1/3;grid-row:1/2}.card-expimp{grid-column:3/4;grid-row:1/2}.card-fullempty{grid-column:4/5;grid-row:1/2}
.card-vessel{grid-column:1/2;grid-row:2/3}.card-size{grid-column:2/3;grid-row:2/3}.card-shipper{grid-column:3/5;grid-row:2/3;display:flex;flex-direction:column}.card-carrier{grid-column:1/5;grid-row:3/4}
/* chart tabs */
.ctab-row{display:flex;gap:2px;flex-shrink:0}
.ctab{background:none;border:1px solid transparent;color:var(--muted);cursor:pointer;font-size:9px;padding:1px 6px;border-radius:3px;white-space:nowrap}
.ctab.active{background:var(--card2);border-color:var(--border);color:var(--text)}
/* shipper tabs */
.tab-row{display:flex;gap:4px;padding:4px 8px;border-bottom:1px solid var(--border);flex-shrink:0}
.tab-btn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:11px;padding:2px 8px;border-radius:4px}
.tab-btn.active{background:var(--accent);color:#fff}
.tbl-wrap{overflow-y:auto;flex:1;min-height:0}
table{width:100%;border-collapse:collapse;font-size:11px}
th{position:sticky;top:0;background:var(--card2);color:var(--muted);font-weight:600;padding:4px 6px;text-align:right;white-space:nowrap}
th:first-child{text-align:left}
td{padding:3px 6px;border-bottom:1px solid rgba(51,65,85,.5);text-align:right}
td:first-child{text-align:left;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
tr:hover td{background:var(--card2)}
.rank-badge{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;font-size:8px;font-weight:700;margin-right:3px}
.rank-1{background:#f59e0b;color:#000}.rank-2{background:#94a3b8;color:#000}.rank-3{background:#b45309;color:#fff}.rank-n{background:var(--border);color:var(--muted)}
/* FULL/EMPTY graphic */
.fe-body{display:flex;flex-direction:column;padding:4px 6px;gap:3px}
.fe-chart-wrap{flex:1;position:relative;min-height:0}
.fe-overlay{position:absolute;top:50%;left:50%;transform:translate(-50%,-55%);text-align:center;pointer-events:none}
.fe-pct{font-size:17px;font-weight:700;color:var(--green);line-height:1}
.fe-sub{font-size:9px;color:var(--muted)}
.fe-bars{flex-shrink:0;display:flex;flex-direction:column;gap:3px;padding:0 2px 2px}
.fe-row{display:flex;align-items:center;gap:4px;font-size:10px}
.fe-lbl{color:var(--muted);width:22px;text-align:right;flex-shrink:0}
.fe-track{flex:1;height:8px;background:var(--border);border-radius:4px;overflow:hidden;display:flex}
.fe-seg{height:100%;transition:width .4s}
.fe-nums{font-size:9px;color:var(--muted);width:58px;text-align:right;flex-shrink:0;white-space:nowrap}
/* Size bars */
.sz-body{display:flex;flex-direction:column;justify-content:space-evenly;padding:6px 8px;gap:0}
.sz-row{display:flex;align-items:center;gap:5px}
.sz-lbl{color:var(--text);font-weight:700;width:36px;flex-shrink:0;font-size:11px}
.sz-sec{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);border-bottom:1px solid var(--border);padding-bottom:1px;margin-top:2px}.sz-sec span:first-child{color:var(--text);font-weight:700}
.sz-track{flex:1;height:14px;background:var(--border);border-radius:3px;overflow:hidden;cursor:pointer}
.sz-fill{height:100%;border-radius:3px;transition:width .4s;display:flex;align-items:center;justify-content:flex-end;padding-right:4px}
.sz-fill span{font-size:9px;color:#fff;font-weight:700;text-shadow:0 0 4px rgba(0,0,0,.5)}
.sz-vals{min-width:72px;text-align:right;flex-shrink:0}
.sz-teu{font-weight:700;font-size:11px;display:block;line-height:1.2}
.sz-pct{font-size:9px;color:var(--muted)}
/* modal */
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:100;padding:20px}
#modalBox{background:var(--card);border-radius:12px;width:100%;height:100%;display:flex;flex-direction:column;overflow:hidden}
#modalHdr{display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border);flex-shrink:0}
#modalTitle{font-size:15px;font-weight:700;flex:1}
#modalClose{background:none;border:none;color:var(--muted);cursor:pointer;font-size:20px;padding:4px 8px}
#modalClose:hover{color:var(--text)}
#modalBody{flex:1;display:flex;gap:12px;padding:12px;min-height:0;overflow:hidden}
.modal-chart-col{flex:1;min-width:0;position:relative}
.modal-table-col{width:340px;flex-shrink:0;display:flex;flex-direction:column;min-height:0}
.modal-tbl-title{font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px;flex-shrink:0}
.modal-tbl-scroll{overflow-y:auto;flex:1;min-height:0}
.modal-tbl-scroll table{font-size:12px}
.modal-tbl-scroll th{font-size:11px;padding:5px 8px}
.modal-tbl-scroll td{padding:4px 8px}
#uploadHint{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:var(--muted)}
::-webkit-scrollbar{width:4px;height:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
</style>
</head>
<body>
<header>
  <h1>&#x1F6A2; &#xD758;&#xC544;&#xB77C;&#xC778; <span>&#xC6B8;&#xC0B0;&#xD56D;</span> &#xBB3C;&#xB3D9;&#xB7C9;</h1>
  <div id="loadingBar"><div id="loadingFill"></div></div>
  <div id="statusBar">&#xB85C;&#xB529; &#xC911;...</div>
  <label style="cursor:pointer;font-size:11px;color:var(--muted);border:1px solid var(--border);padding:2px 8px;border-radius:5px;flex-shrink:0">
    &#x1F4C2; CSV<input type="file" accept=".csv" style="display:none" onchange="loadFile(event)">
  </label>
  <button class="btn" style="font-size:11px;flex-shrink:0" onclick="exportCSV()">&#x2B07; &#xB0B4;&#xBCF4;&#xB0B4;&#xAE30;</button>
</header>
<div id="alertBar"></div>
<div id="controls">
  <span class="ctrl-label">&#x1F4C5; &#xC6D4;</span>
  <div id="monthBtns" style="display:flex;gap:4px;flex-wrap:wrap"></div>
  <div class="divider"></div>
  <span class="ctrl-label">&#xAE30;&#xAC04;</span>
  <input type="date" id="dateFrom" onchange="onDateChange()">
  <span style="color:var(--muted);font-size:12px">~</span>
  <input type="date" id="dateTo" onchange="onDateChange()">
  <div class="divider"></div>
  <span class="ctrl-label">&#xAD6C;&#xBD84;</span>
  <button class="btn active" id="btnAll" onclick="setDir('all',this)">&#xC804;&#xCCB4;</button>
  <button class="btn exp-btn" id="btnExp" onclick="setDir('수출',this)">&#xC218;&#xCD9C;</button>
  <button class="btn imp-btn" id="btnImp" onclick="setDir('수입',this)">&#xC218;&#xC785;</button>
  <div class="divider"></div>
  <span class="ctrl-label">화물</span>
  <button class="btn cg-btn active" id="cgAll" onclick="setCargo('all',this)">전체</button>
  <button class="btn cg-btn" id="cgLocal" onclick="setCargo('로컬',this)">로컬</button>
  <button class="btn cg-btn" id="cgTs" onclick="setCargo('환적',this)">환적</button>
  <div class="divider"></div>
  <span class="ctrl-label">신고세관</span>
  <select id="filterPort" onchange="applyFilter()"><option value="all">전체</option></select>
  <div class="divider"></div>
  <span class="ctrl-label">선사부호</span>
  <select id="filterCarrier" onchange="onCarrierChange()"><option value="all">전체</option></select>
  <div class="divider"></div>
  <span class="ctrl-label">선박명</span>
  <select id="filterVessel" onchange="applyFilter()" style="max-width:170px"><option value="all">전체</option></select>
</div>
<div id="kpiRow">
  <div class="kpi kpi-total"><div class="kpi-label">&#xCD1D; &#xBB3C;&#xB3D9;&#xB7C9;</div><div class="kpi-val" id="kpiTotalTeu">&mdash;</div><div class="kpi-sub" id="kpiTotalSub">TEU</div></div>
  <div class="kpi kpi-exp"><div class="kpi-label">&#xC218;&#xCD9C; TEU</div><div class="kpi-val" id="kpiExpTeu">&mdash;</div><div class="kpi-sub" id="kpiExpSub">&mdash;</div></div>
  <div class="kpi kpi-imp"><div class="kpi-label">&#xC218;&#xC785; TEU</div><div class="kpi-val" id="kpiImpTeu">&mdash;</div><div class="kpi-sub" id="kpiImpSub">&mdash;</div></div>
  <div class="kpi kpi-ts"><div class="kpi-label">환적 TEU (양하+적하)</div><div class="kpi-val" id="kpiTsTeu">&mdash;</div><div class="kpi-sub" id="kpiTsSub">&mdash;</div></div>
  <div class="kpi kpi-v"><div class="kpi-label">&#xBAA8;&#xC120; &#xC218;</div><div class="kpi-val" id="kpiVessels">&mdash;</div><div class="kpi-sub" id="kpiVesselsSub">&#xCC99;</div></div>
  <div class="kpi kpi-s"><div class="kpi-label">&#xD654;&#xC8FC; &#xC218;</div><div class="kpi-val" id="kpiShippers">&mdash;</div><div class="kpi-sub">&#xAC1C;&#xC0AC;</div></div>
  <div class="kpi kpi-f"><div class="kpi-label">FULL &#xBE44;&#xC728;</div><div class="kpi-val" id="kpiFullRate">&mdash;</div><div class="kpi-sub" id="kpiFullSub">%</div></div>
</div>
<div id="uploadHint"><div style="font-size:48px">&#x1F4E6;</div><div>&#xB370;&#xC774;&#xD130;&#xB97C; &#xBD88;&#xB7EC;&#xC624;&#xB294; &#xC911;&#xC785;&#xB2C8;&#xB2E4;...</div></div>
<div id="dash" style="display:none">
  <!-- 일별 TEU 추이 (탭: 수출/수입 | FULL/EMPTY) -->
  <div class="card card-daily">
    <div class="card-hdr">
      <span class="card-title">&#x1F4C5; &#xC6D4;&#xBCC4; TEU &#xCD94;&#xC774; (2026)</span>
      <div class="ctab-row">
        <button class="ctab active" onclick="setDailyTab('expimp',this)">&#xC218;&#xCD9C;/&#xC218;&#xC785;</button>
        <button class="ctab" onclick="setDailyTab('fullempty',this)">FULL/EMPTY</button>
      </div>
      <button class="expand-btn" onclick="openModal('daily','&#xC6D4;&#xBCC4; TEU &#xCD94;&#xC774;')">&#x26F6;</button>
    </div>
    <div class="card-body"><canvas id="chartDaily"></canvas></div>
  </div>
  <!-- 수출/수입 도넛 -->
  <div class="card card-expimp">
    <div class="card-hdr"><span class="card-title">&#x1F504; &#xC218;&#xCD9C;/&#xC218;&#xC785;</span><button class="expand-btn" onclick="openModal('expimp','&#xC218;&#xCD9C;/&#xC218;&#xC785; &#xC0C1;&#xC138;')">&#x26F6;</button></div>
    <div class="card-body"><canvas id="chartExpimp"></canvas></div>
  </div>
  <!-- FULL/EMPTY 그래픽 -->
  <div class="card card-fullempty">
    <div class="card-hdr"><span class="card-title">&#x1F4E6; FULL/EMPTY</span><button class="expand-btn" onclick="openModal('fullempty','FULL/EMPTY &#xC0C1;&#xC138;')">&#x26F6;</button></div>
    <div class="fe-body card-body" style="padding:4px 6px">
      <div class="fe-chart-wrap">
        <canvas id="chartFullempty"></canvas>
        <div class="fe-overlay"><div class="fe-pct" id="fePct">-</div><div class="fe-sub">FULL</div></div>
      </div>
      <div class="fe-bars">
        <div class="fe-row"><span class="fe-lbl">&#xC218;&#xCD9C;</span><div class="fe-track"><div class="fe-seg" id="feExpFull" style="background:#2ea44f"></div><div class="fe-seg" id="feExpEmpty" style="background:#475569"></div></div><span class="fe-nums" id="feExpNums">-</span></div>
        <div class="fe-row"><span class="fe-lbl">&#xC218;&#xC785;</span><div class="fe-track"><div class="fe-seg" id="feImpFull" style="background:#1a7a3c"></div><div class="fe-seg" id="feImpEmpty" style="background:#374151"></div></div><span class="fe-nums" id="feImpNums">-</span></div>
      </div>
    </div>
  </div>
  <!-- 모선별 TEU -->
  <div class="card card-vessel">
    <div class="card-hdr"><span class="card-title">&#x1F6A2; &#xBAA8;&#xC120;&#xBCC4; TEU</span><button class="expand-btn" onclick="openModal('vessel','&#xBAA8;&#xC120;&#xBCC4; TEU &#xC0C1;&#xC138;')">&#x26F6;</button></div>
    <div class="card-body"><canvas id="chartVessel"></canvas></div>
  </div>
  <!-- 사이즈 별도 표시 -->
  <div class="card card-size">
    <div class="card-hdr"><span class="card-title">&#x1F4D0; 컨테이너 규격 (전체 / EMPTY)</span><button class="expand-btn" onclick="openModal('size','&#xADDC;&#xACA9;&#xBCC4; &#xC0C1;&#xC138;')">&#x26F6;</button></div>
    <div class="sz-body card-body" style="padding:6px 8px" id="sizeBars"></div>
  </div>
  <!-- 화주별 -->
  <div class="card card-shipper">
    <div class="card-hdr"><span class="card-title">&#x1F3E2; &#xD654;&#xC8FC;&#xBCC4; &#xBB3C;&#xB3D9;&#xB7C9;</span><button class="expand-btn" onclick="openShipperModal()">&#x26F6;</button></div>
    <div class="tab-row"><button class="tab-btn active" onclick="setShipperTab('all',this)">&#xC804;&#xCCB4;</button><button class="tab-btn" onclick="setShipperTab('수출',this)">&#xC218;&#xCD9C;</button><button class="tab-btn" onclick="setShipperTab('수입',this)">&#xC218;&#xC785;</button></div>
    <div class="tbl-wrap"><table><thead><tr><th>&#xD654;&#xC8FC;&#xBA85;</th><th>TEU</th><th style="color:var(--exp)">&#xC218;&#xCD9C;</th><th style="color:var(--imp)">&#xC218;&#xC785;</th><th style="color:var(--green)">FULL</th><th>&#xC810;&#xC720;&#xC728;</th></tr></thead><tbody id="shipperTableBody"></tbody></table></div>
  </div>
</div>
<div id="modal" onclick="if(event.target===this)closeModal()">
  <div id="modalBox">
    <div id="modalHdr"><span id="modalTitle"></span><button id="modalClose" onclick="closeModal()">&#x2715;</button></div>
    <div id="modalBody"></div>
  </div>
</div>
<script>
var rawData=[],filteredData=[],charts={},shipperTab="all";
var activeDir="all",activeMonth="all",dailyTab="expimp",selectedMonths=new Set();
var availableMonths=[],loadedMonths=new Set(),monthlyIndex={},monthlyFE={},summaryRows=null;
// ── 분류 기준 (PLISM 원본 필드) ─────────────────────────
// ── PLISM 모선별 현황 조회조건과 동일한 기준 ──
// 기간: ETD(수출 출항일)/ETA(수입 입항일) = 출발일자
// 신고세관: MRN 목록 customs 앞 3자리 (110=울산세관)
// 선사부호: customs_line_code = MBL번호 앞 4자리 (HASL)
// 선박명: MRN 목록 vessel_name
var CUSTOMS_NAMES={"110":"울산세관","030":"부산세관","062":"광양세관","020":"인천세관","016":"평택세관","100":"옥계세관","122":"포항세관"};
var CARRIER_NAMES={SNKO:"장금상선",HASL:"흥아라인",KMTC:"고려해운",DJSC:"동진상선",PCSL:"범주해운",NSSL:"남성해운",CKCO:"천경해운",POBU:"팬오션",TSLU:"TS라인",EVER:"에버그린",WHLU:"완하이",CULN:"CU라인"};
// 항구: MRN 국내항 UN/LOCODE
var PORT_NAMES={KRUSN:"울산",KRPUS:"부산",KRBNP:"부산신항",KRKAN:"광양",KRINC:"인천",KRPTK:"평택",KRKPO:"포항",KRMAS:"마산",KRGUN:"군산",KRTSN:"대산",KRMOK:"목포",KRYOS:"여수",KRCHA:"진해"};
function carrierCode(r){var c=r["운항선사코드"];if(c)return c;var m=r["MRN"]||"";return m.length>=6?m.substring(2,6):"";}
function carrierLabel(c){if(!c)return"미상";return CARRIER_NAMES[c]?CARRIER_NAMES[c]+"("+c+")":c;}
function blCode(r){return(r["MBL번호"]||"").substring(0,4);}
function carrierOf(r){return carrierLabel(blCode(r));}
function operatorOf(r){return carrierLabel(carrierCode(r));}
function portLabel(p){if(!p)return"미수집";return PORT_NAMES[p]?PORT_NAMES[p]+"("+p+")":p;}
function customsCode(r){return(r["세관"]||"").substring(0,3);}
function customsLabel(c){if(!c)return"미수집";return CUSTOMS_NAMES[c]?CUSTOMS_NAMES[c]+"("+c+")":c;}
function portOf(r){return customsLabel(customsCode(r));}
var customsDefaulted=false;
// 환적: 수입 화물구분 T(환적 양하), 수출 화물구분 R(환적 적하) — 양하·적하 각각 집계
var activeCargo="all";
function cargoCls(r){return r["화물구분"]||(r["수출입구분"]==="수입"?r["풀엠티구분"]:"")||"";}
function isTS(r){var c=cargoCls(r);return c==="T"||c==="R";}
function setCargo(c,btn){activeCargo=c;document.querySelectorAll("#controls .cg-btn").forEach(function(b){b.classList.remove("active");});btn.classList.add("active");applyFilter();}
function sumTeu(a){return a.reduce(function(s,r){return s+teu(r);},0);}
function rowKey(r){return(r["수출입구분"]||"")+"|"+(r["MRN"]||"")+"|"+(r["컨테이너번호"]||"");}
function trendVal(ym,kind,val){
  if(!summaryRows){if(kind==="dir")return(monthlyIndex[ym]&&monthlyIndex[ym][val==="수출"?"exp_teu":"imp_teu"])||0;return(monthlyFE[ym]&&monthlyFE[ym][val==="F"?"full":"empty"])||0;}
  var carrier=document.getElementById("filterCarrier").value,vessel=document.getElementById("filterVessel").value,port=document.getElementById("filterPort").value,s=0;
  summaryRows.forEach(function(x){
    if(x[0]!==ym)return;
    if(carrier!=="all"&&carrierLabel(x[8]||"")!==carrier)return;
    if(vessel!=="all"&&(x[9]||"")!==vessel)return;
    if(port!=="all"&&customsLabel(x[2])!==port)return;
    if(activeDir!=="all"&&x[3]!==activeDir)return;
    var ts=(x[5]==="T"||x[5]==="R");
    if(activeCargo==="로컬"&&ts)return;if(activeCargo==="환적"&&!ts)return;
    if(kind==="flow"){var pp=val.split("|");if(x[3]!==pp[0]||(pp[1]==="T")!==ts)return;}
    if(kind==="dir"&&x[3]!==val)return;
    if(kind==="fe"&&x[4]!==val)return;
    s+=x[6];});
  return s;
}

function parseCSV(text){
  var lines=text.trim().split("\n");
  var headers=lines[0].split(",").map(function(h){return h.trim().replace(/^"|"$/g,"");});
  return lines.slice(1).map(function(line){
    var cols=[],cur="",inQ=false;
    for(var i=0;i<line.length;i++){var c=line[i];if(c==='"'){inQ=!inQ;continue;}if(c===","&&!inQ){cols.push(cur.trim());cur="";continue;}cur+=c;}
    cols.push(cur.trim());
    var row={};headers.forEach(function(h,i){row[h]=(cols[i]||"").replace(/^"|"$/g,"");});
    return row;
  }).filter(function(r){return Object.values(r).some(function(v){return v;});});
}

function setLoading(pct,msg){
  document.getElementById("loadingBar").style.display=pct<100?"block":"none";
  document.getElementById("loadingFill").style.width=pct+"%";
  document.getElementById("statusBar").textContent=msg;
}

  setLoading(10,"인덱스 로딩 중...");
  try{
    var res=await fetch("./data/index.json");
    if(res.ok){
      var idx=await res.json();
      if(idx.months){
        monthlyIndex=idx.months;
        try{var sres=await fetch("./data/summary.json");if(sres.ok){var sj=await sres.json();summaryRows=sj.rows||null;}}catch(e){}
var _n=new Date(),_cym=_n.getFullYear()*100+(_n.getMonth()+1);
availableMonths=Object.entries(idx.months).map(function(e){var k=e[0],v=e[1];return Object.assign({key:k,label:k.slice(0,4)+"년 "+parseInt(k.slice(4))+"월"},v);}).filter(function(m){return parseInt(m.key)<=_cym;}).sort(function(a,b){return a.key.localeCompare(b.key);});
        buildMonthButtons();
        var latest=availableMonths[availableMonths.length-1];
        await loadMonth(latest.key);return;
      }
    }
  }catch(e){}

    var res=await fetch("./data/prism_data.csv");
    if(res.ok){var text=await res.text();rawData=parseCSV(text);detectMonths();buildMonthButtons();setLoading(100,"");showAlert("✅ 데이터 로드 완료 — "+rawData.length.toLocaleString()+"건","success");initDashboard();applyFilter();return;}
  }catch(e){}
  setLoading(100,"데이터 없음");
  showAlert("⚠️ 데이터를 찾을 수 없습니다. CSV를 직접 업로드해주세요.","error");
}

function detectMonths(){
  var s=new Set();
  rawData.forEach(function(r){var d=(r["출발일자"]||"").replace(/[.\-]/g,"").substring(0,6);if(d.length===6)s.add(d);});
  availableMonths=[...s].sort().map(function(k){return{key:k,label:k.slice(0,4)+"년 "+parseInt(k.slice(4))+"월"};});
}

async function loadMonth(key){
  if(loadedMonths.has(key)){activeMonth=key;filterByMonth(key);return;}
  setLoading(50,key+" 로딩...");
  try{
    var res=await fetch("./data/monthly_"+key+".csv");
    if(res.ok){
      var text=await res.text();var rows=parseCSV(text);
      rawData=rawData.filter(function(r){return(r["출발일자"]||"").replace(/[.\-]/g,"").substring(0,6)!==key;});
      rawData=rawData.concat(rows);loadedMonths.add(key);
var _ft=rows.filter(isFull).reduce(function(s,r){return s+teu(r);},0),_at=rows.reduce(function(s,r){return s+teu(r);},0);
monthlyFE[key]={full:_ft,empty:_at-_ft};
activeMonth=key;
      var m=availableMonths.find(function(m){return m.key===key;});
      setLoading(100,"");showAlert("✅ "+(m?m.label:key)+" — "+rows.length.toLocaleString()+"건","success");
      filterByMonth(key);return;
    }
  }catch(e){}
  setLoading(60,"전체 CSV 로딩...");
  try{
    var res=await fetch("./data/prism_data.csv");
    if(res.ok){var text=await res.text();rawData=parseCSV(text);detectMonths();buildMonthButtons();availableMonths.forEach(function(m){loadedMonths.add(m.key);});activeMonth=key;setLoading(100,"");showAlert("✅ 전체 — "+rawData.length.toLocaleString()+"건","success");filterByMonth(key);}
  }catch(e){setLoading(100,"오류");showAlert("❌ 데이터 로드 실패","error");}
}

async function loadAllMonths(){
  var unloaded=availableMonths.filter(function(m){return!loadedMonths.has(m.key);});
  for(var i=0;i<unloaded.length;i++){
    var m=unloaded[i];setLoading(Math.round((i/Math.max(unloaded.length,1))*80)+10,m.label+" 로딩...");
    try{
      var res=await fetch("./data/monthly_"+m.key+".csv");
      if(res.ok){var text=await res.text();var rows=parseCSV(text);rawData=rawData.filter(function(r){return(r["출발일자"]||"").replace(/[.\-]/g,"").substring(0,6)!==m.key;});rawData=rawData.concat(rows);loadedMonths.add(m.key);}
    }catch(e){}
  }
  setLoading(100,"");showAlert("✅ 전체 — "+rawData.length.toLocaleString()+"건","success");
}

function buildMonthButtons(){
  var c=document.getElementById("monthBtns");c.innerHTML="";
  var allBtn=document.createElement("button");
  allBtn.className="btn"+(selectedMonths.size===0?" active":"");allBtn.textContent="전체";
  allBtn.onclick=async function(){selectedMonths.clear();await loadAllMonths();buildMonthButtons();applyFilter();};
  c.appendChild(allBtn);
  availableMonths.forEach(function(m){
    var btn=document.createElement("button");
    btn.className="btn"+(selectedMonths.has(m.key)?" active":"");btn.textContent=m.label;
    btn.setAttribute("data-ym",m.key);
    btn.onclick=async function(){
      if(selectedMonths.has(m.key)){selectedMonths.delete(m.key);}else{await loadMonth(m.key);selectedMonths.add(m.key);}
      if(selectedMonths.size===0){await loadAllMonths();}
      buildMonthButtons();applyFilter();
    };
    c.appendChild(btn);
  });
}
function setMonthActive(b){document.querySelectorAll("#monthBtns .btn").forEach(function(x){x.classList.remove("active");});b.classList.add("active");}

function filterByMonth(key){
  if(key!=="all"){selectedMonths=new Set([key]);}else{selectedMonths.clear();}
  buildMonthButtons();
  initDashboard();applyFilter();
}

function loadFile(ev){
  var f=ev.target.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(e){var rows=parseCSV(e.target.result);rawData=rawData.concat(rows);detectMonths();buildMonthButtons();showAlert("✅ \""+f.name+"\" — "+rows.length.toLocaleString()+"건 추가","success");initDashboard();applyFilter();};
  r.readAsText(f,"UTF-8");
}

function applyFilter(){
  var from=(document.getElementById("dateFrom").value||"").replace(/-/g,"");
  var to=(document.getElementById("dateTo").value||"").replace(/-/g,"");
  var carrier=document.getElementById("filterCarrier").value;
  var port=document.getElementById("filterPort").value;
  var vessel=document.getElementById("filterVessel").value;
  var seenKey=new Set();var dedupData=[];
  rawData.forEach(function(r){var k=rowKey(r);if(!seenKey.has(k)){seenKey.add(k);dedupData.push(r);}});
  filteredData=dedupData.filter(function(r){
    var d=(r["출발일자"]||"").replace(/[.\-]/g,"").substring(0,8);
    var ym=d.substring(0,6);
    if(selectedMonths.size>0&&!selectedMonths.has(ym))return false;
    if(selectedMonths.size===0&&from&&d&&d<from)return false;
    if(selectedMonths.size===0&&to&&d&&d>to)return false;
    if(activeDir!=="all"&&r["수출입구분"]!==activeDir)return false;
    if(carrier!=="all"&&carrierOf(r)!==carrier)return false;
    if(vessel!=="all"&&r["모선명"]!==vessel)return false;
    if(port!=="all"&&portOf(r)!==port)return false;
    if(activeCargo==="로컬"&&isTS(r))return false;
    if(activeCargo==="환적"&&!isTS(r))return false;
    return true;
  });
  updateKPIs();updateCharts();updateShipperTable(shipperTab);
}

function teu(r){return parseFloat(r["TEU"]||r["teu"]||0)||0;}
function isFull(r){if(r["FE"])return r["FE"]==="F";return r["풀엠티구분"]==="FULL"||r["풀엠티구분"]==="F";}

function updateKPIs(){
  var d=filteredData;
  var total=d.reduce(function(s,r){return s+teu(r);},0);
  var exp=d.filter(function(r){return r["수출입구분"]==="수출";}).reduce(function(s,r){return s+teu(r);},0);
  var imp=d.filter(function(r){return r["수출입구분"]==="수입";}).reduce(function(s,r){return s+teu(r);},0);
  var vCount=new Set(d.map(function(r){return r["모선명"];})).size;
  var sCount=new Set(d.map(function(r){return r["화주명"];})).size;
  var full=d.filter(isFull).reduce(function(s,r){return s+teu(r);},0);
  var fRate=total>0?(full/total*100).toFixed(1):0;
  document.getElementById("kpiTotalTeu").textContent=total.toLocaleString();
  document.getElementById("kpiExpTeu").textContent=exp.toLocaleString();
  document.getElementById("kpiImpTeu").textContent=imp.toLocaleString();
  document.getElementById("kpiVessels").textContent=vCount;
  document.getElementById("kpiShippers").textContent=sCount;
  document.getElementById("kpiFullRate").textContent=fRate;
  document.getElementById("kpiTotalSub").textContent="TEU ("+d.length.toLocaleString()+"건)";
  var expTs=sumTeu(d.filter(function(r){return r["수출입구분"]==="수출"&&isTS(r);})),impTs=sumTeu(d.filter(function(r){return r["수출입구분"]==="수입"&&isTS(r);}));
  document.getElementById("kpiExpSub").textContent="로컬 "+(exp-expTs).toLocaleString()+" · 환적 "+expTs.toLocaleString();
  document.getElementById("kpiImpSub").textContent="로컬 "+(imp-impTs).toLocaleString()+" · 환적 "+impTs.toLocaleString();
  document.getElementById("kpiTsTeu").textContent=(expTs+impTs).toLocaleString();
  document.getElementById("kpiTsSub").textContent="양하 "+impTs.toLocaleString()+" · 적하 "+expTs.toLocaleString()+(total>0?" ("+((expTs+impTs)/total*100).toFixed(1)+"%)":"");
  document.getElementById("kpiVesselsSub").textContent="항차 "+new Set(d.map(function(r){return r["모선명"]+"|"+r["항차"];})).size+"회";
  document.getElementById("kpiFullSub").textContent="EMPTY: "+(100-fRate).toFixed(1)+"%";
}

// 막대 위 숫자 표시: 구간값(충분히 클 때) + 누적 합계
var barValuePlugin={id:"barValues",afterDatasetsDraw:function(chart){
  var ctx=chart.ctx,metas=chart.data.datasets.map(function(d,i){return chart.getDatasetMeta(i);}).filter(function(m){return !m.hidden;});
  if(!metas.length)return;var big=chart.canvas.height>500;
  ctx.save();ctx.textAlign="center";
  metas.forEach(function(m){m.data.forEach(function(bar,i){var v=chart.data.datasets[m.index].data[i];if(!v)return;var hgt=Math.abs(bar.base-bar.y);
    if(hgt<(big?16:12))return;ctx.font=(big?"12px":"9px")+" sans-serif";ctx.fillStyle="#fff";ctx.textBaseline="middle";ctx.fillText(Math.round(v).toLocaleString(),bar.x,(bar.y+bar.base)/2);});});
  var n=chart.data.labels.length;for(var i=0;i<n;i++){var tot=0,top=null,x=null;
    metas.forEach(function(m){var v=chart.data.datasets[m.index].data[i]||0;tot+=v;var b=m.data[i];if(b&&(top===null||b.y<top)){top=b.y;x=b.x;}});
    if(tot>0&&top!==null){ctx.font="bold "+(big?"13px":"10px")+" sans-serif";ctx.fillStyle="#e2e8f0";ctx.textBaseline="bottom";ctx.fillText(Math.round(tot).toLocaleString(),x,top-2);}}
  ctx.restore();}};
var baseOpts={responsive:true,maintainAspectRatio:false,animation:{duration:150},plugins:{legend:{labels:{font:{size:10},color:"#94a3b8"}}}};
function destroyChart(id){if(charts[id]){charts[id].destroy();delete charts[id];}}

function updateCharts(){updateMonthlyTrendChart();updateExpImpChart();updateFullEmptyChart();updateVesselChart();updateSizeChart();}

function getChartMonths(){
  var months=[],now=new Date(),curYM=now.getFullYear()*100+(now.getMonth()+1);
  for(var ym=202601;ym<=curYM;ym++){var m=ym%100;if(m<1||m>12)continue;months.push(String(ym));}
  return months;
}
function updateMonthlyTrendChart(){
  destroyChart("daily");
  var cms=getChartMonths();
  var labels=cms.map(function(ym){return parseInt(ym.slice(4))+"월";});
  var datasets=dailyTab==="expimp"?[
    {label:"수출(로컬)",data:cms.map(function(ym){return trendVal(ym,"flow","수출|L");}),backgroundColor:"rgba(232,76,76,.8)",stack:"s"},{label:"수출(환적 적하)",data:cms.map(function(ym){return trendVal(ym,"flow","수출|T");}),backgroundColor:"rgba(245,158,11,.85)",stack:"s"},
    {label:"수입(로컬)",data:cms.map(function(ym){return trendVal(ym,"flow","수입|L");}),backgroundColor:"rgba(33,150,243,.7)",stack:"s"},{label:"수입(환적 양하)",data:cms.map(function(ym){return trendVal(ym,"flow","수입|T");}),backgroundColor:"rgba(168,85,247,.75)",stack:"s"}
  ]:[
    {label:"FULL",data:cms.map(function(ym){return trendVal(ym,"fe","F");}),backgroundColor:"rgba(46,164,79,.8)",stack:"s"},
    {label:"EMPTY",data:cms.map(function(ym){return trendVal(ym,"fe","E");}),backgroundColor:"rgba(71,85,105,.7)",stack:"s"}
  ];
  charts["daily"]=new Chart(document.getElementById("chartDaily"),{
    type:"bar",data:{labels:labels,datasets:datasets},plugins:[barValuePlugin],
    options:Object.assign({},baseOpts,{interaction:{mode:"index"},onClick:function(evt,els){
      if(els&&els.length){var idx=els[0].index;var ym=cms[idx];
      var mb=document.querySelector('#monthBtns .btn[data-ym="'+ym+'"]');
      if(mb){mb.click();}}
    },scales:{
      x:{stacked:true,ticks:{font:{size:11},color:"#94a3b8"},grid:{color:"rgba(51,65,85,.3)"}},
      y:{stacked:true,grace:"10%",ticks:{font:{size:9},color:"#94a3b8"},grid:{color:"#334155"},title:{display:true,text:"TEU",font:{size:9},color:"#94a3b8"}}
    }})
  });
}

function makeDoughnut(id,canvasId,labels,data,colors){
  destroyChart(id);
  charts[id]=new Chart(document.getElementById(canvasId),{
    type:"doughnut",
    data:{labels:labels,datasets:[{data:data,backgroundColor:colors,borderWidth:2,borderColor:"#1e293b"}]},
    options:{responsive:true,maintainAspectRatio:false,animation:{duration:150},cutout:"62%",plugins:{
      legend:{position:"bottom",labels:{font:{size:10},color:"#94a3b8",padding:5,boxWidth:10}},
      tooltip:{callbacks:{label:function(c){return c.label+": "+c.parsed.toLocaleString()+" TEU";}}}
    }}
  });
}

function updateExpImpChart(){
  var exp=filteredData.filter(function(r){return r["수출입구분"]==="수출";}).reduce(function(s,r){return s+teu(r);},0);
  var imp=filteredData.filter(function(r){return r["수출입구분"]==="수입";}).reduce(function(s,r){return s+teu(r);},0);
  var eT=sumTeu(filteredData.filter(function(r){return r["수출입구분"]==="수출"&&isTS(r);})),iT=sumTeu(filteredData.filter(function(r){return r["수출입구분"]==="수입"&&isTS(r);}));
  makeDoughnut("expimp","chartExpimp",["수출(로컬)","수출(환적 적하)","수입(로컬)","수입(환적 양하)"],[exp-eT,eT,imp-iT,iT],["#e84c4c","#f59e0b","#2196F3","#a855f7"]);
}

function updateFullEmptyChart(){
  var d=filteredData;
  var expFull=d.filter(function(r){return r["수출입구분"]==="수출"&&isFull(r);}).reduce(function(s,r){return s+teu(r);},0);
  var expEmpty=d.filter(function(r){return r["수출입구분"]==="수출"&&!isFull(r);}).reduce(function(s,r){return s+teu(r);},0);
  var impFull=d.filter(function(r){return r["수출입구분"]==="수입"&&isFull(r);}).reduce(function(s,r){return s+teu(r);},0);
  var impEmpty=d.filter(function(r){return r["수출입구분"]==="수입"&&!isFull(r);}).reduce(function(s,r){return s+teu(r);},0);
  var full=expFull+impFull, empty=expEmpty+impEmpty, total=full+empty;
  var fPct=total>0?(full/total*100).toFixed(1):0;
  makeDoughnut("fullempty","chartFullempty",["FULL","EMPTY"],[full,empty],["#2ea44f","#475569"]);

function sizeCat(r){

  if(c[0]==="2")return"20'";
  if(c[0]==="4"||c[0]==="L")return c[1]==="5"?"40'HC":"40'";
  var g=String(r["컨테이너규격"]||"");return g.indexOf("20")>=0?"20'":(g.indexOf("40")>=0?"40'":"기타");
}
function sizeRowsHtml(d,title,color){
  var cats=["20'","40'","40'HC","기타"],m={};cats.forEach(function(k){m[k]={van:0,teu:0};});
  d.forEach(function(r){var k=sizeCat(r);m[k].van++;m[k].teu+=teu(r);});
  var totT=cats.reduce(function(s,k){return s+m[k].teu;},0),totV=cats.reduce(function(s,k){return s+m[k].van;},0);
  var maxT=Math.max.apply(null,cats.map(function(k){return m[k].teu;}));
  var html='<div class="sz-sec"><span>'+title+'</span><span>'+totV.toLocaleString()+' VAN · '+totT.toLocaleString()+' TEU</span></div>';
  cats.forEach(function(k){if(!m[k].van)return;
    var pct=totT>0?(m[k].teu/totT*100).toFixed(1):0,w=maxT>0?(m[k].teu/maxT*100).toFixed(1):0;
    html+='<div class="sz-row"><span class="sz-lbl">'+k+'</span><div class="sz-track"><div class="sz-fill" style="width:'+w+'%;background:'+color[k]+'"><span>'+(w>30?pct+"%":"")+'</span></div></div>'

  return html;
}

    '<div class="modal-tbl-scroll"><table><thead><tr><th style="text-align:left">구분</th><th style="color:#2ea44f">FULL</th><th style="color:#475569">EMPTY</th><th>합계</th><th>FULL율</th></tr></thead><tbody>'+
    '<tr><td style="color:#e84c4c;font-weight:700">수출</td><td style="color:#2ea44f">'+expFull.toLocaleString()+'</td><td style="color:#94a3b8">'+expEmpty.toLocaleString()+'</td><td>'+(expFull+expEmpty).toLocaleString()+'</td><td>'+(expFull+expEmpty>0?(expFull/(expFull+expEmpty)*100).toFixed(1):0)+'%</td></tr>'+
    '<tr><td style="color:#2196F3;font-weight:700">수입</td><td style="color:#2ea44f">'+impFull.toLocaleString()+'</td><td style="color:#94a3b8">'+impEmpty.toLocaleString()+'</td><td>'+(impFull+impEmpty).toLocaleString()+'</td><td>'+(impFull+impEmpty>0?(impFull/(impFull+impEmpty)*100).toFixed(1):0)+'%</td></tr>'+
    '<tr style="font-weight:700"><td>합계</td><td style="color:#2ea44f">'+full.toLocaleString()+'</td><td style="color:#94a3b8">'+empty.toLocaleString()+'</td><td>'+tot.toLocaleString()+'</td><td>'+(tot>0?(full/tot*100).toFixed(1):0)+'%</td></tr>'+
    '</tbody></table></div>');
  var ctx=document.getElementById("modalCanvas").getContext("2d");
  modalChart=new Chart(ctx,{type:"doughnut",data:{labels:["수출FULL","수입FULL","수출EMPTY","수입EMPTY"],datasets:[{data:[expFull,impFull,expEmpty,impEmpty],backgroundColor:["#2ea44f","#1a7a3c","#e84c4c40","#2196F340"],borderWidth:2,borderColor:"#1e293b"}]},
    options:{responsive:true,maintainAspectRatio:false,animation:{duration:0},cutout:"50%",plugins:{legend:{position:"bottom",labels:{font:{size:13},color:"#94a3b8",padding:10}},tooltip:{callbacks:{label:function(c){return c.label+": "+c.parsed.toLocaleString()+" TEU";}}}}}});
}

function openVesselModal(){
  var byV={};
  filteredData.forEach(function(r){
    var v=r["모선명"]||"미상";
    if(!byV[v])byV[v]={수출:0,수입:0,full:0,cnt:0,voyages:new Set()};
    var t=teu(r);byV[v].수출+=(r["수출입구분"]==="수출"?t:0);byV[v].수입+=(r["수출입구분"]==="수입"?t:0);
    if(isFull(r))byV[v].full+=t;byV[v].cnt++;byV[v].voyages.add(r["항차"]||"");
  });
  var rows=Object.entries(byV).sort(function(a,b){return(b[1].수출+b[1].수입)-(a[1].수출+a[1].수입);});
  var allT=filteredData.reduce(function(s,r){return s+teu(r);},0);
  var top15=rows.slice(0,15);
  renderModalLayout(makeModalCanvas(),
    '<div class="modal-tbl-title">모선별 상세 ('+rows.length+'척)</div>'+
    '<div class="modal-tbl-scroll"><table><thead><tr><th style="text-align:left">모선명</th><th>TEU</th><th style="color:#e84c4c">수출</th><th style="color:#2196F3">수입</th><th style="color:#2ea44f">FULL</th><th>항차</th><th>점유율</th></tr></thead><tbody>'+
    rows.map(function(e){var v=e[1],tot=v.수출+v.수입;return'<tr><td title="'+e[0]+'">'+e[0]+'</td><td><b>'+tot.toLocaleString()+'</b></td><td style="color:#e84c4c">'+v.수출.toLocaleString()+'</td><td style="color:#2196F3">'+v.수입.toLocaleString()+'</td><td style="color:#2ea44f">'+v.full.toLocaleString()+'</td><td style="color:var(--muted)">'+v.voyages.size+'</td><td>'+(allT>0?(tot/allT*100).toFixed(1):0)+'%</td></tr>';}).join("")+
    '</tbody></table></div>');
  var vs=top15.map(function(e){return e[0];});
  var byVM={};top15.forEach(function(e){byVM[e[0]]=e[1];});
  var ctx=document.getElementById("modalCanvas").getContext("2d");
  modalChart=new Chart(ctx,{type:"bar",data:{labels:vs,datasets:[
    {label:"수출",data:vs.map(function(v){return byVM[v].수출||0;}),backgroundColor:"rgba(232,76,76,.8)",stack:"s"},
    {label:"수입",data:vs.map(function(v){return byVM[v].수입||0;}),backgroundColor:"rgba(33,150,243,.7)",stack:"s"}
  ]},options:{responsive:true,maintainAspectRatio:false,animation:{duration:0},indexAxis:"y",
    plugins:{legend:{labels:{font:{size:13},color:"#94a3b8"}}},
    scales:{x:{stacked:true,ticks:{font:{size:11},color:"#94a3b8"},grid:{color:"#334155"}},y:{stacked:true,ticks:{font:{size:10},color:"#94a3b8"}}}}});
}

function openSizeModal(){
  var d=filteredData;
  var total=d.reduce(function(s,r){return s+teu(r);},0);
  var sizeMap={};
  d.forEach(function(r){
    var sz=r["컨테이너규격"]||"기타";
    if(!sizeMap[sz])sizeMap[sz]={total:0,수출:0,수입:0,full:0};
    var t=teu(r);sizeMap[sz].total+=t;
    if(r["수출입구분"]==="수출")sizeMap[sz].수출+=t;else sizeMap[sz].수입+=t;
    if(isFull(r))sizeMap[sz].full+=t;
  });
  var rows=Object.entries(sizeMap).sort(function(a,b){return b[1].total-a[1].total;});
  var s20=rows.filter(function(e){return String(e[0]).includes("20");}).reduce(function(s,e){return s+e[1].total;},0);
  var s40=rows.filter(function(e){return String(e[0]).includes("40");}).reduce(function(s,e){return s+e[1].total;},0);
  var sOth=total-s20-s40;
  renderModalLayout(makeModalCanvas(),
    '<div class="modal-tbl-title">규격별 상세</div>'+
    '<div class="modal-tbl-scroll"><table><thead><tr><th style="text-align:left">규격</th><th>TEU</th><th style="color:#e84c4c">수출</th><th style="color:#2196F3">수입</th><th style="color:#2ea44f">FULL</th><th>비율</th></tr></thead><tbody>'+
    rows.map(function(e){var v=e[1];return'<tr><td>'+e[0]+'</td><td><b>'+v.total.toLocaleString()+'</b></td><td style="color:#e84c4c">'+v.수출.toLocaleString()+'</td><td style="color:#2196F3">'+v.수입.toLocaleString()+'</td><td style="color:#2ea44f">'+v.full.toLocaleString()+'</td><td>'+(total>0?(v.total/total*100).toFixed(1):0)+'%</td></tr>';}).join("")+
    '</tbody></table></div>');
  var ctx=document.getElementById("modalCanvas").getContext("2d");
  modalChart=new Chart(ctx,{type:"doughnut",data:{labels:["20'","40'","기타"],datasets:[{data:[s20,s40,Math.max(0,sOth)],backgroundColor:["#f59e0b","#7c3aed","#475569"],borderWidth:2,borderColor:"#1e293b"}]},
    options:{responsive:true,maintainAspectRatio:false,animation:{duration:0},cutout:"55%",plugins:{legend:{position:"bottom",labels:{font:{size:14},color:"#94a3b8",padding:12}},tooltip:{callbacks:{label:function(c){return c.label+": "+c.parsed.toLocaleString()+" TEU";}}}}}});
}

function openShipperModal(){
  document.getElementById("modalTitle").textContent="화주별 물동량 상세";
  if(modalChart){modalChart.destroy();modalChart=null;}
  var data=shipperTab==="all"?filteredData:filteredData.filter(function(r){return r["수출입구분"]===shipperTab;});
  var byS={};
  data.forEach(function(r){
    var s=r["화주명"]||"미상";
    if(!byS[s])byS[s]={total:0,exp:0,imp:0,full:0,empty:0,cnt:0};
    var t=teu(r);byS[s].total+=t;byS[s].cnt++;
    if(r["수출입구분"]==="수출")byS[s].exp+=t;else byS[s].imp+=t;
    if(isFull(r))byS[s].full+=t;else byS[s].empty+=t;
  });
  var rows=Object.entries(byS).sort(function(a,b){return b[1].total-a[1].total;});
  var allT=filteredData.reduce(function(s,r){return s+teu(r);},0);
  var top10=rows.slice(0,10);
  document.getElementById("modal").style.display="block";
  document.getElementById("modalBody").innerHTML=
    '<div class="modal-chart-col">'+makeModalCanvas()+'</div>'+
    '<div class="modal-table-col">'+
    '<div class="modal-tbl-title">화주별 상세 ('+rows.length+'개사)</div>'+
    '<div class="modal-tbl-scroll"><table><thead><tr><th style="text-align:left">순위</th><th style="text-align:left">화주명</th><th>TEU</th><th style="color:#e84c4c">수출</th><th style="color:#2196F3">수입</th><th style="color:#2ea44f">FULL</th><th>건수</th><th>점유율</th></tr></thead><tbody>'+
    rows.map(function(e,i){var v=e[1];return'<tr><td style="color:var(--muted)">'+(i+1)+'</td><td title="'+e[0]+'" style="max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+e[0]+'</td><td><b>'+v.total.toLocaleString()+'</b></td><td style="color:#e84c4c">'+v.exp.toLocaleString()+'</td><td style="color:#2196F3">'+v.imp.toLocaleString()+'</td><td style="color:#2ea44f">'+v.full.toLocaleString()+'</td><td style="color:var(--muted)">'+v.cnt+'</td><td>'+(allT>0?(v.total/allT*100).toFixed(1):0)+'%</td></tr>';}).join("")+
    '</tbody></table></div></div>';
  var labels=top10.map(function(e){return e[0];});
  var ctx=document.getElementById("modalCanvas").getContext("2d");
  modalChart=new Chart(ctx,{type:"bar",data:{labels:labels,datasets:[
    {label:"수출",data:top10.map(function(e){return e[1].exp;}),backgroundColor:"rgba(232,76,76,.8)",stack:"s"},
    {label:"수입",data:top10.map(function(e){return e[1].imp;}),backgroundColor:"rgba(33,150,243,.7)",stack:"s"}
  ]},options:{responsive:true,maintainAspectRatio:false,animation:{duration:0},indexAxis:"y",
    plugins:{legend:{labels:{font:{size:13},color:"#94a3b8"}}},
    scales:{x:{stacked:true,ticks:{font:{size:11},color:"#94a3b8"},grid:{color:"#334155"}},y:{stacked:true,ticks:{font:{size:11},color:"#94a3b8"}}}}});
}

function exportCSV(){
  if(!filteredData.length){showAlert("데이터가 없습니다.","error");return;}
  var h=Object.keys(filteredData[0]);
  var csv=[h.join(",")].concat(filteredData.map(function(r){return h.map(function(k){return'"'+((r[k]||"").toString().replace(/"/g,'""'))+'"';}).join(",");})).join("\n");
  var a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob(["﻿"+csv],{type:"text/csv;charset=utf-8;"}));
  a.download="울산항_물동량_"+new Date().toISOString().slice(0,10)+".csv";a.click();
}

var aTimer=null;
function showAlert(msg,type){
  type=type||"info";
  var el=document.getElementById("alertBar");
  el.className="alert alert-"+type;el.textContent=msg;el.style.display="flex";
  clearTimeout(aTimer);aTimer=setTimeout(function(){el.style.display="none";},5000);
}

init();
</script>
</body>
</html>
